<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2f7d6d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="たすかRe">
<title>たすかReマインド</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root {
  --bg: #f6f4ef;
  --surface: #ffffff;
  --ink: #23262b;
  --muted: #6a6f78;
  --line: #e3dfd6;
  --accent: #2f7d6d;
  --accent-ink: #ffffff;
  --accent-soft: #e2f1ec;
  --warn: #b5620b;
  --warn-soft: #fcefdc;
  --late: #b3261e;
  --late-soft: #fbe4e2;
  --radius: 14px;
  --shadow: 0 1px 2px rgba(0,0,0,.05), 0 2px 8px rgba(0,0,0,.04);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #16181b; --surface: #202328; --ink: #eceae6; --muted: #a2a7ae; --line: #33373d;
    --accent: #5fbfa8; --accent-ink: #0d1f1a; --accent-soft: #1f3530;
    --warn: #f0a656; --warn-soft: #3a2c1b; --late: #ff8a80; --late-soft: #3d2221;
    --shadow: none; color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic UI", "Meiryo", system-ui, sans-serif;
  font-size: 16px; line-height: 1.6;
}
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--accent); }

.top {
  position: sticky; top: 0; z-index: 5; display: flex; align-items: center; justify-content: space-between; gap: 8px;
  padding: 10px 16px; background: var(--surface); border-bottom: 1px solid var(--line);
}
.brand { font-weight: 700; letter-spacing: .02em; white-space: nowrap; font-size: 15px; }
.brand span { color: var(--accent); }
.top-right { display: flex; align-items: center; gap: 8px; min-width: 0; }
.child-name { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 40vw; }
.child-select { max-width: 44vw; padding: 4px 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
.store-badge { font-size: 11px; padding: 2px 8px; border-radius: 99px; background: var(--accent-soft); color: var(--accent); white-space: nowrap; }

.main { max-width: 720px; margin: 0 auto; padding: 12px 16px calc(88px + env(safe-area-inset-bottom)); }
.site-foot { max-width: 720px; margin: 0 auto; padding: 0 16px calc(84px + env(safe-area-inset-bottom)); color: var(--muted); font-size: 12px; line-height: 1.6; }
.site-foot p { margin: 4px 0; }
body:has(.site-foot) .main { padding-bottom: 8px; }
.tabs {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 5; display: grid; grid-template-columns: repeat(5, 1fr);
  background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom);
}
.tabs button {
  border: 0; background: none; padding: 8px 2px 10px; font-size: 11px; color: var(--muted);
  display: flex; flex-direction: column; align-items: center; gap: 2px; cursor: pointer;
}
.tabs button .ico { font-size: 18px; line-height: 1.2; }
.tabs button.on { color: var(--accent); font-weight: 700; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; margin: 0 0 12px; box-shadow: var(--shadow); }
.card-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 6px; }
.card h2 { font-size: 16px; margin: 0; }
.date-line { margin: 4px 2px 10px; color: var(--muted); font-size: 14px; }
.sub-head { margin: 10px 0 2px; font-size: 13px; color: var(--muted); font-weight: 600; }
.empty { color: var(--muted); margin: 6px 0; font-size: 14px; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.warn { background: var(--warn-soft); color: var(--ink); border-radius: 10px; padding: 10px 12px; font-size: 14px; }
.hint { background: var(--accent-soft); border-radius: 10px; padding: 10px 12px; font-size: 14px; margin: 0 0 10px; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 4px; min-height: 40px; padding: 8px 14px;
  border-radius: 10px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; text-decoration: none;
  font-size: 15px; line-height: 1.3; text-align: center;
}
.btn:active { transform: translateY(1px); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.btn.ghost { background: transparent; border-color: transparent; color: var(--accent); }
.btn.danger { color: var(--late); }
.btn.sm { min-height: 34px; padding: 5px 10px; font-size: 14px; }
.btn.block { display: flex; width: 100%; }
.icon-btn { min-width: 36px; padding: 4px 8px; font-size: 18px; }
.btn:focus-visible, .linklike:focus-visible, .kv:focus-visible, button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.file-btn { cursor: pointer; }
.stack { display: grid; gap: 8px; }
.toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 0 0 12px; }
.spacer { flex: 1; }
.row-end { display: flex; justify-content: flex-end; margin-top: 8px; }
.linklike { border: 0; background: none; padding: 0; text-align: left; cursor: pointer; color: inherit; }

.item { display: flex; gap: 10px; align-items: flex-start; justify-content: space-between; padding: 10px 0; border-top: 1px solid var(--line); }
.card-head + .item, .sub-head + .item, .card > .item:first-child { border-top: 0; }
.item-main { min-width: 0; flex: 1; }
.item-title { font-weight: 600; display: block; }
.item-sub { font-size: 13px; color: var(--muted); margin-top: 2px; }
.item-contact { font-size: 14px; margin-top: 4px; }
.item-note { font-size: 13px; margin-top: 4px; padding: 6px 8px; background: var(--bg); border-radius: 8px; }
.item-actions { display: flex; flex-direction: column; gap: 6px; align-items: stretch; flex-shrink: 0; }
.item-btn { width: 100%; background: none; border-left: 0; border-right: 0; border-bottom: 0; text-align: left; cursor: pointer; color: inherit; }
.chev { font-size: 22px; color: var(--muted); align-self: center; }

.pill { display: inline-block; font-size: 12px; padding: 1px 8px; border-radius: 99px; background: var(--bg); border: 1px solid var(--line); color: var(--muted); white-space: nowrap; vertical-align: middle; }
.pill-soon { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
.pill-late { background: var(--late-soft); color: var(--late); border-color: transparent; font-weight: 600; }
.pill-ok { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
.vis-family { background: var(--late-soft); color: var(--late); border-color: transparent; }
.vis-all { background: var(--accent-soft); color: var(--accent); border-color: transparent; }

.seg { display: flex; gap: 4px; overflow-x: auto; margin: 0 0 12px; padding: 3px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
.seg button { flex: 1 0 auto; border: 0; background: none; padding: 7px 10px; border-radius: 9px; font-size: 14px; cursor: pointer; color: var(--muted); white-space: nowrap; }
.seg button.on { background: var(--accent); color: var(--accent-ink); font-weight: 600; }

.kv { display: grid; grid-template-columns: 7.5em 1fr auto; gap: 8px; align-items: start; width: 100%; text-align: left; background: none; border: 0; border-top: 1px solid var(--line); padding: 9px 0; cursor: pointer; color: inherit; }
.card-head + .kv { border-top: 0; }
.kv .k { font-size: 13px; color: var(--muted); font-weight: 600; }
.kv .v { word-break: break-word; }
.kv.past { opacity: .75; padding-left: 12px; }
.kv.past .v { text-decoration: line-through; text-decoration-color: var(--muted); }
.kv.past-only { cursor: default; }
.history-toggle { border: 0; background: none; color: var(--accent); font-size: 13px; padding: 0 0 6px 7.5em; cursor: pointer; }

.proc { padding: 10px 0; border-top: 1px solid var(--line); }
.card-head + .proc { border-top: 0; }
.proc-head { display: flex; width: 100%; justify-content: space-between; gap: 8px; border: 0; background: none; padding: 0; text-align: left; cursor: pointer; color: inherit; font-weight: 600; }
.bar { height: 6px; background: var(--bg); border-radius: 99px; margin: 6px 0; overflow: hidden; }
.bar span { display: block; height: 100%; background: var(--accent); border-radius: 99px; }
.steps { list-style: none; margin: 6px 0 0; padding: 0; }
.step { display: grid; grid-template-columns: 1.5em 1fr; gap: 2px 6px; align-items: center; padding: 6px 0; }
.step .step-meta { grid-column: 2; display: flex; gap: 6px; align-items: center; }
.step .btn { grid-column: 2; justify-self: start; }
.step .mark { color: var(--muted); text-align: center; }
.step.done .mark { color: var(--accent); }
.step.done .linklike { color: var(--muted); }
.step.now .mark { color: var(--warn); }
.step.now .linklike { font-weight: 600; }

.timeline { list-style: none; margin: 0; padding: 0; }
.tl { display: grid; gap: 2px; width: 100%; text-align: left; background: none; border: 0; border-left: 2px solid var(--accent-soft); padding: 6px 0 10px 12px; cursor: pointer; color: inherit; }
.tl-date { font-size: 13px; color: var(--muted); font-weight: 600; }

.dl { display: grid; grid-template-columns: 7em 1fr; gap: 4px 10px; margin: 0; font-size: 14px; }
.dl dt { color: var(--muted); }
.dl dd { margin: 0; }
.care-steps { margin: 0; padding-left: 1.4em; }
.care-steps li { padding: 6px 0; border-top: 1px dashed var(--line); }
.care-steps li:first-child { border-top: 0; }
.care-step { display: grid; gap: 2px; width: 100%; text-align: left; background: none; border: 0; padding: 0; cursor: pointer; color: inherit; }
.care-criteria { font-size: 13px; color: var(--warn); }
.mover { display: inline-flex; gap: 2px; }
.guide-q { font-size: 14px; color: var(--muted); background: var(--bg); border-radius: 10px; padding: 10px 12px; }
.guide-q b { color: var(--ink); font-weight: 600; }

/* フォーム（下から出るシート） */
.backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 20; }
.sheet {
  position: fixed; z-index: 21; left: 0; right: 0; bottom: 0; max-height: 92vh; overflow-y: auto;
  background: var(--surface); border-radius: 18px 18px 0 0; padding: 12px 16px calc(16px + env(safe-area-inset-bottom));
}
@media (min-width: 760px) {
  .sheet { left: 50%; right: auto; width: 640px; transform: translateX(-50%); bottom: auto; top: 6vh; border-radius: 18px; max-height: 88vh; }
}
.sheet-head { display: flex; align-items: center; justify-content: space-between; position: sticky; top: -12px; background: var(--surface); padding: 4px 0 6px; z-index: 1; }
.sheet-head h2 { font-size: 17px; margin: 0; }
.fields { display: grid; gap: 12px; }
.field { display: grid; gap: 4px; }
.field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.lbl { font-size: 14px; font-weight: 600; }
.req { font-size: 11px; color: var(--late); font-weight: 600; margin-left: 4px; }
.help { font-size: 12px; color: var(--muted); }
.field input, .field select, .field textarea {
  width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); font-size: 16px; min-height: 44px;
}
.field textarea { resize: vertical; }
.check { display: flex; gap: 8px; align-items: center; font-size: 14px; }
.check input { width: 20px; height: 20px; }
.sheet-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 4px; }
.preview { background: var(--bg); border-radius: 10px; padding: 8px 12px; }
.preview ol { margin: 4px 0; padding-left: 1.4em; }
.tpl-source { margin: 6px 0 2px; }
.tpl-source > summary { cursor: pointer; }
.tpl-source p { margin: 4px 0 0; line-height: 1.5; overflow-wrap: anywhere; }
.proc .tpl-source { padding: 0 4px 6px; }
.notice p { margin: 8px 0; }

.toast {
  position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(80px + env(safe-area-inset-bottom)); z-index: 30;
  background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-size: 14px; max-width: calc(100% - 32px); box-shadow: 0 4px 16px rgba(0,0,0,.2);
}
.boot { max-width: 480px; margin: 20vh auto; padding: 16px; text-align: center; }
.spinner { width: 32px; height: 32px; margin: 0 auto 12px; border: 3px solid var(--line); border-top-color: var(--accent); border-radius: 50%; animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* 印刷用の書類 */
.print-bar { position: sticky; top: 0; z-index: 5; display: flex; gap: 8px; align-items: center; padding: 10px 16px; background: var(--surface); border-bottom: 1px solid var(--line); }
.print-hint { max-width: 800px; margin: 8px auto 0; padding: 0 16px; font-size: 13px; color: var(--muted); }
.doc { max-width: 800px; margin: 12px auto 40px; padding: 24px 20px; background: #fff; color: #111; border: 1px solid var(--line); border-radius: 8px; font-size: 15px; }
.doc h1 { font-size: 22px; margin: 0 0 4px; }
.doc h2 { font-size: 17px; border-bottom: 2px solid #333; padding-bottom: 2px; margin: 20px 0 8px; }
.doc h3 { font-size: 15px; margin: 14px 0 4px; }
.doc .doc-sub { font-size: 16px; }
.doc-meta { color: #555; font-size: 13px; margin: 0 0 10px; }
.doc-table { border-collapse: collapse; width: 100%; margin: 6px 0; font-size: 14px; }
.doc-table th, .doc-table td { border: 1px solid #999; padding: 5px 8px; text-align: left; vertical-align: top; }
.doc-table th { background: #f1f1f1; width: 28%; font-weight: 600; }
.doc ol { padding-left: 1.5em; }
.doc li { margin: 4px 0; }
.doc-criteria { color: #444; font-size: 13px; }
.doc-foot { margin-top: 24px; font-size: 12px; color: #555; }
.doc-block { break-inside: avoid-page; }

@media print {
  body { background: #fff; }
  .no-print, .top, .tabs, .toast { display: none !important; }
  .doc { border: 0; margin: 0; padding: 0; max-width: none; }
  .doc h2, .doc h3 { break-after: avoid; }
  .doc-table tr, .doc li { break-inside: avoid; }
}

/* 第2版で追加した表示 */
.age { font-weight: 400; font-size: 12px; color: var(--muted); margin-left: 2px; }
.caution { display: block; font-size: 13px; color: var(--warn); margin-top: 2px; }
.rhythm { list-style: none; margin: 0; padding: 0; }
.rhythm-row { display: grid; grid-template-columns: 3.6em 1fr auto; gap: 10px; align-items: center; width: 100%; background: none; border: 0; border-top: 1px solid var(--line); padding: 8px 0; text-align: left; cursor: pointer; color: inherit; }
.rhythm li:first-child .rhythm-row { border-top: 0; }
.rhythm-time { font-variant-numeric: tabular-nums; font-weight: 700; color: var(--accent); }
.dept { display: grid; gap: 2px; width: 100%; text-align: left; background: var(--bg); border: 0; border-radius: 10px; padding: 8px 10px; margin-top: 6px; cursor: pointer; color: inherit; }
.dept-name { font-weight: 600; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.btn.chip { border-radius: 99px; min-height: 32px; font-size: 13px; }
.star { color: var(--warn); }
.tl-more { padding-left: 14px; }
.tl-detail { margin: 0 0 10px 14px; font-size: 13px; }
.doc-toc { font-size: 13px; color: #333; columns: 2; margin: 6px 0 16px; padding-left: 1.4em; }
.doc-event { font-weight: 700; margin: 10px 0 2px; }
.rhythm-table th { width: 5em; }
@media print {
  .doc-chapter { break-before: page; }
  .doc-chapter:first-of-type { break-before: auto; }
}

/* Googleドライブ同期 */
button.store-badge { border: 0; cursor: pointer; font: inherit; font-size: 11px; }
.store-badge.sync-syncing { background: var(--warn-soft); color: var(--warn); }
.store-badge.sync-needLogin, .store-badge.sync-error { background: var(--late-soft); color: var(--late); }
.sync-banner { display: flex; gap: 10px; align-items: center; justify-content: space-between; padding: 8px 16px; background: var(--warn-soft); font-size: 13px; border-bottom: 1px solid var(--line); }
.sync-banner-error { background: var(--late-soft); }
.sync-banner .btn { white-space: nowrap; flex-shrink: 0; }

/* 使えるかもしれない制度（目安） */
.benefit { border-top: 1px solid var(--line); }
.card-head + .benefit, .hint + .benefit, .warn + .benefit { border-top: 0; }
.benefit > summary { position: relative; display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; justify-content: flex-start; padding: 11px 26px 11px 0; cursor: pointer; list-style: none; }
.benefit > summary::-webkit-details-marker { display: none; }
.benefit > summary::after { content: '＋'; position: absolute; right: 2px; top: 12px; color: var(--muted); font-size: 14px; }
.benefit[open] > summary::after { content: '－'; }
.benefit-name { font-weight: 600; flex: 1 1 100%; }
.benefit-tags { display: flex; flex-wrap: wrap; gap: 4px; }
.benefit-body { padding: 0 0 12px; font-size: 14px; line-height: 1.65; }
.benefit-body p { margin: 0 0 8px; }
.benefit-notes { margin: 0 0 8px; padding-left: 1.2em; }
.benefit-notes li { margin: 2px 0; }
.benefit-actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.card-head.sub { margin-top: 10px; border-top: 1px solid var(--line); padding-top: 6px; }
.card-head.sub .sub-head { margin: 0; }
.showif[hidden] { display: none; }

</style>
</head>
<body>
<div id="app"><noscript>このアプリを使うには、JavaScriptを有効にしてください。</noscript></div>
<footer class="site-foot no-print"><p>たすかReマインド（task-a-remind）は、障害のある子どもや医療的ケアが必要な子どもの情報を1か所にまとめ、医療的ケアの手順書・サポートブックと、手続きのToDo・期限のお知らせを作る無料のアプリです。</p><p><a href="privacy.html">プライバシーポリシー</a>　・　<a href="https://github.com/jeanjeanjean-sama/task-a-remind">ソースコード（GitHub）</a></p></footer>

    var today = opts.today || ymd();
    var processId = uuid();
    var now = nowIso();
    var byKind = opts.contactIdsByKind || {};
    var prev = null;
    var out = [];
    template.steps.forEach(function (st, i) {
      var due = deadline ? addDays(deadline, -(st.daysBefore || 0)) : '';
      if (due && due < today) due = today;
      var t = {
        id: uuid(), createdAt: now, updatedAt: now, deleted: false,
        childId: opts.childId || '',
        title: st.title,
        processId: processId,
        processName: opts.processName || template.name,
        templateId: template.id,
        stepNo: i + 1,
        dependsOn: prev ? [prev.id] : [],
        dueDate: due,
        window: st.window || 'night',
        scheduledDate: '',
        contactId: (st.contactKind && byKind[st.contactKind]) || '',
        script: st.script || '',
        assignee: '',
        status: 'todo',
        doneAt: '',
        certificateId: opts.certificateId || '',
        note: ''
      };
      out.push(t);
      prev = t;
    });
    return out;
  }

  /**
   * 手続き（同じ processId の工程）を始めたときの期限を、工程の目安日から推し量る。
   * 目安日＝期限−daysBefore（今日より前なら今日に詰める）なので、「目安日＋daysBefore」の最小が期限になる。
   */
  function processDeadline(tasks, template) {
    var steps = (template && template.steps) || [];
    var best = '';
    (tasks || []).forEach(function (t) {
      if (!t.dueDate) return;
      var st = steps[(Number(t.stepNo) || 0) - 1];
      var d = addDays(t.dueDate, (st && st.daysBefore) || 0);
      if (d && (!best || d < best)) best = d;
    });
    return best;
  }

  /** 名前の中の「2026年」「2026年度」を1年先にする */
  function nextYearName(name) {
    return String(name || '').replace(/(\d{4})(?=年)/g, function (y) { return String(+y + 1); });
  }

  /**
   * 毎年くり返す型（repeat: "yearly"）の手続きで、工程がすべて終わっていれば、
   * 来年の分を始めるための案（型・期限を1年先にした日・名前・受給者証）を返す。
   * くり返さない型、まだ終わっていない工程がある、来年の分をもう始めている、のときは null。
   */
  function nextRepeat(db, processId, templates) {
    if (!processId) return null;
    var all = alive(db.tasks);
    var mine = all.filter(function (t) { return t.processId === processId; });
    if (!mine.length) return null;
    if (mine.some(function (t) { return t.status === 'todo'; })) return null;
    var first = mine[0];
    var tpl = findTemplate(templates, first.templateId);
    if (!tpl || tpl.repeat !== 'yearly') return null;
    var deadline = processDeadline(mine, tpl);
    // 同じ子どもで、同じ型の、もっと先の期限の手続きがあれば、来年の分はもう始めている
    var others = {};
    all.forEach(function (t) {
      if (t.processId && t.processId !== processId && t.templateId === tpl.id && t.childId === first.childId) {
        (others[t.processId] = others[t.processId] || []).push(t);
      }
    });
    var started = Object.keys(others).some(function (k) {
      var d = processDeadline(others[k], tpl);
      return !deadline || !d || d > deadline;
    });
    if (started) return null;
    return {
      templateId: tpl.id,
      childId: first.childId || '',
      certificateId: first.certificateId || '',
      lastDeadline: deadline,
      deadline: deadline ? addYears(deadline, 1) : '',
      name: nextYearName(first.processName || tpl.name)
    };
  }

  /**
   * 小学校に入学する日（4月1日）。6歳になったあとの最初の4月1日。
   * 満年齢は誕生日の前日に増えるので、4月1日生まれまでは前の学年（早生まれ）になる。
   */
  function schoolEntryDate(birth) {
    var b = parseYmd(birth);
    if (!b) return '';
    var m = b.getMonth() + 1, d = b.getDate();
    var early = m < 4 || (m === 4 && d === 1);
    return (b.getFullYear() + (early ? 6 : 7)) + '-04-01';
  }

  /**
   * 生年月日から、手続きの期限を出す（手続きの型の deadlineFromBirth）。
   *   { "kind": "schoolEntry" }           → 小学校に入学する日（4月1日）
   *   { "kind": "birthday", "age": 18 }   → 18歳の誕生日
   * 返す値：{ date, label, note }。型に決まりがない・生年月日がないときは null。
   */
  function birthDeadline(template, birthDate) {
    var r = template && template.deadlineFromBirth;
    if (!r || !parseYmd(birthDate)) return null;
    var note = r.note || '';
    if (r.kind === 'schoolEntry') return { date: schoolEntryDate(birthDate), label: '小学校に入学する日', note: note };
    if (r.kind === 'birthday' && Number(r.age) > 0) return { date: addYears(birthDate, Number(r.age)), label: Number(r.age) + '歳の誕生日', note: note };
    return null;
  }

  /** 期限が近いのに、更新の手続きをまだ始めていない受給者証・手帳 */
  function certificateAlerts(db, today, childId, days) {
    var tasks = alive(db.tasks);
    return alive(db.certificates).filter(function (c) {
      if (childId && c.childId !== childId) return false;
      if (!c.validUntil) return false;
      var d = diffDays(today, c.validUntil);
      if (d === null || d > days) return false;
      return !tasks.some(function (t) { return t.certificateId === c.id && t.status === 'todo'; });
    }).map(function (c) {
      return { cert: c, daysLeft: diffDays(today, c.validUntil) };
    }).sort(function (a, b) { return a.daysLeft - b.daysLeft; });
  }

  /** 今日の画面・夜のまとめ通知の元になる集計 */
  function summarize(db, today, opts) {
    opts = opts || {};
    var childId = opts.childId;
    var byId = indexById(db.tasks);
    var tomorrow = addDays(today, 1);
    var r = { night: [], dayToday: [], dayTomorrow: [], dayUnscheduled: [], dayLater: [] };
    alive(db.tasks).forEach(function (t) {
      if (childId && t.childId !== childId) return;
      if (!isActionable(t, byId)) return;
      if (t.window === 'day') {
        if (!t.scheduledDate) r.dayUnscheduled.push(t);
        else if (t.scheduledDate <= today) r.dayToday.push(t);
        else if (t.scheduledDate === tomorrow) r.dayTomorrow.push(t);
        else r.dayLater.push(t);
      } else {
        r.night.push(t);
      }
    });
    var byDue = function (a, b) { return (a.dueDate || '9999').localeCompare(b.dueDate || '9999'); };
    Object.keys(r).forEach(function (k) { r[k].sort(byDue); });
    r.certs = certificateAlerts(db, today, childId, opts.certDays || 120);
    return r;
  }

  // ---------- 使えるかもしれない制度（目安） ----------
  // 制度の一覧（src/benefits.json）と、子どもの手帳・受給者証を照らし合わせる。
  // 言い切らない：結果は「当てはまりそう（likely）」か「条件しだい（maybe）」の2段階だけ。
  // 医療の情報を含むので、通知（Discord）の文面には使わない。
  var HANDBOOK_KINDS = ['身体障害者手帳', '療育手帳', '精神障害者保健福祉手帳'];
  var Z2H = { '０': '0', '１': '1', '２': '2', '３': '3', '４': '4', '５': '5', '６': '6', '７': '7', '８': '8', '９': '9', 'Ａ': 'A', 'Ｂ': 'B', 'ａ': 'A', 'ｂ': 'B' };

  /** 手帳の等級を「1級」「A1」などの形で返す。選ぶ欄が空なら、書いてある欄から読み取れるときだけ使う */
  function certGrade(c) {
    if (!c) return '';
    if (c.gradeCode) return c.gradeCode;
    if (HANDBOOK_KINDS.indexOf(c.kind) < 0) return '';
    var s = String(c.grade || '').replace(/[０-９ＡＢａｂ]/g, function (ch) { return Z2H[ch]; });
    var found = [];
    var re = /([1-6])\s*級/g, m;
    while ((m = re.exec(s))) found.push(m[1] + '級');
    re = /([ABab])\s*([12])/g;
    while ((m = re.exec(s))) found.push(m[1].toUpperCase() + m[2]);
    // 2つ以上読み取れたときは、どれか分からないので使わない
    var uniq = found.filter(function (x, i) { return found.indexOf(x) === i; });
    return uniq.length === 1 ? uniq[0] : '';
  }

  function ageYears(birth, today) {
    var b = parseYmd(birth), t = parseYmd(today);
    if (!b || !t) return null;
    var y = t.getFullYear() - b.getFullYear();
    if (t.getMonth() < b.getMonth() || (t.getMonth() === b.getMonth() && t.getDate() < b.getDate())) y -= 1;
    return y;
  }

  /** 1つの条件を、持っている証明書と照らす → 'yes' / 'unknown'（情報が足りない）/ 'no' */
  function evalCond(cond, certs, why) {
    var best = 'no', note = '';
    certs.forEach(function (c) {
      if (c.kind !== cond.kind || best === 'yes') return;
      var r = 'yes', miss = [];
      if (cond.grades) {
        var g = certGrade(c);
        if (!g) { r = 'unknown'; miss.push('等級'); }
        else if (cond.grades.indexOf(g) < 0) r = 'no';
      }
      if (r !== 'no' && cond.types) {
        var ts = [c.disabilityType, c.disabilityType2].filter(Boolean);
        if (!ts.length) { r = 'unknown'; miss.push('障害の種類'); }
        else if (!ts.some(function (x) { return cond.types.indexOf(x) >= 0; })) r = 'no';
      }
      if (r !== 'no' && cond.fareClass) {
        if (!c.fareClass) { r = 'unknown'; miss.push('第1種・第2種'); }
        else if (c.fareClass !== cond.fareClass) r = 'no';
      }
      if (r === 'yes' || (r === 'unknown' && best === 'no')) {
        best = r;
        var g2 = certGrade(c);
        note = c.kind + (g2 ? ' ' + g2 : '') + (r === 'unknown' ? '（' + miss.join('・') + 'が入っていません）' : '');
      }
    });
    if (best !== 'no' && note) why.push(note);
    return best;
  }

  /** when の1行（all：すべて／count：of のうち count 個以上）を評価 */
  function evalWhen(w, certs) {
    var why = [];
    var results = (w.all || w.of || []).map(function (cond) { return evalCond(cond, certs, why); });
    var yes = results.filter(function (r) { return r === 'yes'; }).length;
    var unk = results.filter(function (r) { return r === 'unknown'; }).length;
    var need = w.all ? results.length : (w.count || 1);
    var r = yes >= need ? 'yes' : yes + unk >= need ? 'unknown' : 'no';
    return { result: r, why: why };
  }

  /**
   * 子どもに「使えるかもしれない制度」を出す。
   * 戻り値：{ area: 'match' | 'other' | 'unset', stale, items: [{ benefit, level, why }], checked: [{ benefit, check }] }
   *   area：子どもの市区町村が一覧の地域か（'unset' は未入力。目安として出す）
   *   stale：一覧の見直し期限（reviewBy）を過ぎているか
   */
  function suggestBenefits(db, data, childId, today) {
    var out = { area: 'unset', stale: false, items: [], checked: [] };
    if (!data || !data.benefits) return out;
    today = today || ymd();
    out.stale = !!(data.reviewBy && today > data.reviewBy);
    var child = alive(db.children).filter(function (c) { return c.id === childId; })[0] || {};
    var place = String(child.municipality || '') + String(child.prefecture || '');
    if (place) {
      out.area = (data.areaKeywords || []).some(function (k) { return place.indexOf(k) >= 0; }) ? 'match' : 'other';
      if (out.area === 'other') return out;
    }
    var certs = alive(db.certificates).filter(function (c) {
      return c.childId === childId && (!c.status || c.status === '取得済み');
    });
    var checks = {};
    alive(db.benefitChecks).forEach(function (r) { if (r.childId === childId && r.benefitId) checks[r.benefitId] = r; });
    var age = child.birthDate ? ageYears(child.birthDate, today) : null;
    data.benefits.forEach(function (b) {
      if (checks[b.id]) { out.checked.push({ benefit: b, check: checks[b.id] }); return; }
      if (b.ageUnder && age !== null && age >= b.ageUnder) return;
      if ((b.heldKinds || []).some(function (k) { return certs.some(function (c) { return c.kind === k; }); })) return;
      var level = '', why = [];
      (b.when || []).forEach(function (w) {
        var e = evalWhen(w, certs);
        if (e.result === 'no') return;
        var lv = e.result === 'yes' ? (w.level || 'maybe') : 'maybe';
        if (!level || (level === 'maybe' && lv === 'likely')) { level = lv; why = e.why; }
      });
      if (level) out.items.push({ benefit: b, level: level, why: why });
    });
    out.items.sort(function (a, b) { return (a.level === b.level ? 0 : a.level === 'likely' ? -1 : 1); });
    return out;
  }

  // ---------- 通知の文面（病名など医療の情報は載せない） ----------
  function contactLine(t, contactsById) {
    var c = t.contactId && contactsById[t.contactId];
    if (!c || c.deleted) return '';
    var s = c.name;
    if (c.phone) s += ' ☎ ' + c.phone;
    if (c.hours) s += '（' + c.hours + '）';
    return s;
  }
  function childTag(t, childrenById, multi) {
    if (!multi) return '';
    var c = childrenById[t.childId];
    return c ? '〔' + c.nickname + '〕' : '';
  }

  function buildDigestText(db, today, opts) {
    opts = opts || {};
    var s = summarize(db, today, { certDays: opts.certDays });
    var children = indexById(alive(db.children));
    var multi = alive(db.children).length > 1;
    var contacts = indexById(db.contacts);
    var lines = [];
    function item(t, extra) {
      var line = '・' + childTag(t, children, multi) + t.title;
      var due = dueLabel(t, today);
      if (due) line += '（' + due + '）';
      if (t.assignee) line += ' 担当：' + t.assignee;
      lines.push(line);
      if (extra) lines.push('　' + extra);
    }
    if (s.night.length) {
      lines.push('【今夜できること】');
      s.night.slice(0, 10).forEach(function (t) { item(t); });
      if (s.night.length > 10) lines.push('　ほか' + (s.night.length - 10) + '件');
    }
    if (s.dayTomorrow.length) {
      lines.push('【明日の昼にやること】');
      s.dayTomorrow.forEach(function (t) { item(t, contactLine(t, contacts)); });
    }
    if (s.dayUnscheduled.length) {
      lines.push('【昼にやる日を決めましょう】');
      s.dayUnscheduled.forEach(function (t) { item(t); });
    }
    if (s.certs.length) {
      lines.push('【期限が近い受給者証・手帳】');
      s.certs.forEach(function (a) {
        var c = a.cert;
        var name = (c.name || c.kind);
        var tag = multi && children[c.childId] ? '〔' + children[c.childId].nickname + '〕' : '';
        lines.push('・' + tag + name + '：' + (a.daysLeft < 0 ? '有効期限を' + (-a.daysLeft) + '日過ぎています' : '有効期限まであと' + a.daysLeft + '日') + '（更新の手続きをまだ始めていません）');
      });
    }
    if (!lines.length) return '';
    var head = '📋 たすかReマインド｜今夜のまとめ（' + fmtMD(today) + '）';
    var tail = opts.appUrl ? '\n▶ アプリを開く：' + opts.appUrl : '';
    return head + '\n' + lines.join('\n') + tail;
  }

  function buildDayText(db, today, opts) {
    opts = opts || {};
    var s = summarize(db, today, {});
    if (!s.dayToday.length) return '';
    var children = indexById(alive(db.children));
    var multi = alive(db.children).length > 1;
    var contacts = indexById(db.contacts);
    var lines = ['☀️ たすかReマインド｜今日の昼にやること（' + fmtMD(today) + '）'];
    s.dayToday.forEach(function (t) {
      lines.push('・' + childTag(t, children, multi) + t.title + (t.assignee ? ' 担当：' + t.assignee : ''));
      var c = contactLine(t, contacts);
      if (c) lines.push('　' + c);
      if (t.script) lines.push('　伝えること：' + t.script);
    });
    if (opts.appUrl) lines.push('▶ 終わったらアプリで完了に：' + opts.appUrl);
    return lines.join('\n');
  }

  // ---------- カレンダー（.ics）書き出し ----------
  function icsEscape(s) {
    return String(s || '').replace(/\\/g, '\\\\').replace(/;/g, '\\;').replace(/,/g, '\\,').replace(/\r?\n/g, '\\n');
  }
  function toIcs(tasks, opts) {
    opts = opts || {};
    var stamp = nowIso().replace(/[-:]/g, '').replace(/\.\d+/, '');
    var out = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//task-a-remind//JP', 'CALSCALE:GREGORIAN',
      'X-WR-CALNAME:' + icsEscape(opts.calName || 'たすかReマインド')];
    alive(tasks).forEach(function (t) {
      if (t.status !== 'todo') return;
      var date = (t.window === 'day' && t.scheduledDate) ? t.scheduledDate : t.dueDate;
      if (!date) return;
      var d = date.replace(/-/g, '');
      var end = addDays(date, 1).replace(/-/g, '');
      out.push('BEGIN:VEVENT', 'UID:' + t.id + '@task-a-remind', 'DTSTAMP:' + stamp,
        'DTSTART;VALUE=DATE:' + d, 'DTEND;VALUE=DATE:' + end,
        'SUMMARY:' + icsEscape((t.window === 'day' ? '【昼】' : '') + t.title),
        'DESCRIPTION:' + icsEscape((t.processName ? t.processName + '\n' : '') + (t.script || '')),
        'BEGIN:VALARM', 'ACTION:DISPLAY', 'DESCRIPTION:' + icsEscape(t.title),
        // 終日予定の前日22時に知らせる
        'TRIGGER:-PT2H', 'END:VALARM', 'END:VEVENT');
    });
    out.push('END:VCALENDAR');
    return out.join('\r\n');
  }

  // ---------- 書き出し・読み込み（移行の道具） ----------
  function makeExport(db, meta) {
    var collections = {};
    Object.keys(db).forEach(function (k) { collections[k] = db[k] || []; });
    return {
      format: EXPORT_FORMAT,
      schemaVersion: CURRENT_SCHEMA_VERSION,
      exportedAt: nowIso(),
      app: meta || {},
      collections: collections
    };
  }

  /**
   * 古い定義で保存されたデータを、今の定義に合わせて直す。
   * 何度実行しても同じ結果になるように書く（起動のたびに実行するため）。
   * 直した記録を [{col, rec}] で返す。
   */
  var CATEGORY_V1_TO_V2 = {
    '性格・特性・関わり方': '特徴と関わり方',
    '生活リズム・食事': '食事',
    '家族・緊急連絡先': 'その他'
  };
  function upgradeCollections(cols) {
    var changed = [];
    var now = nowIso();
    (cols.profile || []).forEach(function (r) {
      var to = CATEGORY_V1_TO_V2[r.category];
      if (to) { r.category = to; r.updatedAt = now; changed.push({ col: 'profile', rec: r }); }
    });
    (cols.certificates || []).forEach(function (r) {
      if (!r.status) { r.status = '取得済み'; r.updatedAt = now; changed.push({ col: 'certificates', rec: r }); }
    });
    return changed;
  }

  /** 書き出しファイルを今の形に直す。定義を変えたらここ（と upgradeCollections）に変換を足す。 */
  function migrate(data) {
    if (data && LEGACY_FORMATS.indexOf(data.format) >= 0) data.format = EXPORT_FORMAT;
    if (!data || data.format !== EXPORT_FORMAT || !data.collections) {
      throw new Error('たすかReマインドの書き出しファイルではありません');
    }
    var v = Number(data.schemaVersion || 1);
    if (v > CURRENT_SCHEMA_VERSION) {
      throw new Error('新しいバージョンのアプリで書き出されたデータです。アプリを更新してください');
    }
    if (v < 2) upgradeCollections(data.collections); // 第1版→第2版：分類の名前、受給者証の状態
    data.schemaVersion = CURRENT_SCHEMA_VERSION;
    return data;
  }

  /** IDが同じなら更新日時が新しい方を残す */
  function mergeImport(current, incoming) {
    var changed = [];
    Object.keys(incoming || {}).forEach(function (col) {
      if (!current[col]) return; // 定義にないデータ種別は無視
      var byId = indexById(current[col]);
      (incoming[col] || []).forEach(function (rec) {
        if (!rec || !rec.id) return;
        var cur = byId[rec.id];
        if (!cur || String(rec.updatedAt || '') > String(cur.updatedAt || '')) changed.push({ col: col, rec: rec });
      });
    });
    return changed;
  }

  // ---------- AIで読み取った書類のデータの取り込み（取り込み用ファイル） ----------
  // 取り込み用ファイルの形は guide/AI読み取りの指示書.md（3-3 で自動生成）と、提案書A（2026-10-21）の 3-1。
  // ID・作成日時・子どもはファイルに書かず、取り込むときにTRMが付ける。
  var IMPORT_FORMAT = 'task-a-remind-import';
  var IMPORT_FORMAT_VERSION = 1;
  /** 取り込める記録の種類（process は記録ではなく「手続きを始める」） */
  var IMPORT_TYPES = ['visits', 'milestones', 'diagnoses', 'certificates', 'contacts', 'profile', 'process'];
  /** 取り込まない項目：番号（あとで手入力）。sourceFile は from から入れる */
  var IMPORT_NUMBER_KEYS = ['number', 'issuerNumber'];
  var PROCESS_FIELDS = [
    { key: 'templateId', label: '手続きの型', type: 'template', required: true },
    { key: 'deadline', label: '締め切り', type: 'date', required: true },
    { key: 'name', label: '手続きの名前', type: 'string' }
  ];
  var WAREKI_RE = /明治|大正|昭和|平成|令和|元年|^[MTSHRmtshr]\s*\d{1,2}[.\/年-]/;

  /**
   * 貼り付けた文やファイルの中身から、取り込み用ファイル（JSON）を取り出す。
   * AIの答えをそのまま貼っても読めるように、コードブロックや前後の説明を飛ばして { 〜 } を探す。
   * 形が違うときは、利用者に見せる文で Error を投げる。
   */
  function parseImportText(text) {
    var s = String(text == null ? '' : text).replace(/^﻿/, '').trim();
    if (!s) throw new Error('中身が空です。AIの答えを貼り付けるか、ファイルを選んでください');
    var tries = [s];
    var fence = /```[a-zA-Z]*\s*\n?([\s\S]*?)```/g, m;
    while ((m = fence.exec(s))) tries.push(m[1].trim());
    var a = s.indexOf('{'), b = s.lastIndexOf('}');
    if (a >= 0 && b > a) tries.push(s.slice(a, b + 1));
    var data = null;
    for (var i = 0; i < tries.length && !data; i++) {
      try {
        var d = JSON.parse(tries[i]);
        if (d && typeof d === 'object' && !Array.isArray(d)) data = d;
      } catch (e) { /* 次を試す */ }
    }
    if (!data) throw new Error('読み取れませんでした。AIの答えの中に、{ で始まり } で終わる部分（JSON）がありません。途中で切れていないか確かめてください');
    if (data.format === EXPORT_FORMAT || LEGACY_FORMATS.indexOf(data.format) >= 0) {
      throw new Error('これは「書き出したデータ」のファイルです。「書き出したデータを読み込む」から読み込んでください');
    }
    if (data.format !== IMPORT_FORMAT) throw new Error('取り込み用ファイルではありません（"format" が "' + IMPORT_FORMAT + '" ではありません）');
    if (Number(data.formatVersion || 1) > IMPORT_FORMAT_VERSION || Number(data.schemaVersion || 0) > CURRENT_SCHEMA_VERSION) {
      throw new Error('新しいバージョンのアプリ用に作られたファイルです。アプリを更新してください');
    }
    if (!Array.isArray(data.records)) throw new Error('取り込む記録（"records"）がありません');
    return data;
  }

  function importNorm(v) {
    var s = String(v == null ? '' : v);
    if (s.normalize) s = s.normalize('NFKC');
    return s.replace(/\s+/g, '').toLowerCase();
  }
  /** 'YYYY-MM-DD' が実際にある日か */
  function isRealDate(s) {
    var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s);
    if (!m) return false;
    var d = new Date(+m[1], +m[2] - 1, +m[3]);
    return d.getFullYear() === +m[1] && d.getMonth() === +m[2] - 1 && d.getDate() === +m[3];
  }
  function isRealMonth(s) {
    var m = /^(\d{4})-(\d{2})$/.exec(s);
    return !!m && +m[2] >= 1 && +m[2] <= 12;
  }
  function optionValues(field, schema) {
    var src = field.optionsRef ? (schema.options || {})[field.optionsRef] : field.options;
    if (!Array.isArray(src)) return null;
    return src.map(function (o) { return typeof o === 'string' ? o : o.value; });
  }
  /** 保管箱のファイル名だけを残す（フォルダの名前には利用者の名前が入ることがあるため） */
  function baseName(s) {
    var parts = String(s == null ? '' : s).trim().split(/[\\\/]/);
    return parts[parts.length - 1];
  }

  /** 重なりを見分けるための「鍵」。同じ鍵の記録は、同じものがありそうと知らせる */
  function duplicateKey(type, r) {
    var n = importNorm;
    switch (type) {
      case 'visits': return r.date ? n(r.date) + '|' + n(r.facility) : '';
      case 'milestones': return r.item ? n(r.item) : '';
      case 'diagnoses': return r.name ? n(r.name) : '';
      case 'certificates': return r.kind ? n(r.kind) + '|' + n(r.validUntil) : '';
      case 'contacts': return r.name ? n(r.name) : '';
      case 'profile': return r.label ? n(r.category) + '|' + n(r.label) + '|' + n(r.value) : '';
      default: return '';
    }
  }
  /** contacts は、名前が同じで、診療科がどちらか空か同じなら重なりとみなす（診療科ごとに1件ずつ登録するため） */
  function sameDuplicate(type, a, b) {
    if (type !== 'contacts') return true;
    var da = importNorm(a.department), db = importNorm(b.department);
    return !da || !db || da === db;
  }
  function duplicateText(type, r) {
    switch (type) {
      case 'visits': return [r.date, r.facility, r.summary].filter(Boolean).join(' ');
      case 'milestones': return r.item || '';
      case 'diagnoses': return r.name || '';
      case 'certificates': return [r.name || r.kind, r.validUntil ? '有効期限 ' + r.validUntil : ''].filter(Boolean).join(' ');
      case 'contacts': return [r.name, r.department].filter(Boolean).join(' ');
      case 'profile': return (r.label || '') + '：' + (r.value || '');
      case 'process': return r.processName || r.name || '';
      default: return '';
    }
  }

  /**
   * 取り込み用ファイルの記録を1件ずつ調べる（保存はしない）。確認の画面はこの結果を出す。
   *   data      … parseImportText() の結果
   *   schema    … src/schema.json
   *   db        … 今のデータ（{ children: [...], visits: [...], ... }）。重なりと生年月日を調べるのに使う
   *   templates … src/templates.json
   *   opts      … { childId: 取り込む先の子ども, today: 'YYYY-MM-DD' }
   * 子どもを選び直したら、もう一度呼ぶ（生まれる前の日付・重なりは子どもごとに違うため）。
   * 返す形は、提案書Aの作業記録（3-1）と test/logic.test.mjs を参照。
   */
  function checkImport(data, schema, db, templates, opts) {
    opts = opts || {};
    db = db || {};
    var today = opts.today || ymd();
    var childId = opts.childId || '';
    var child = childId ? indexById(alive(db.children))[childId] : null;
    var birth = child && isRealDate(String(child.birthDate || '')) ? child.birthDate : '';
    var seen = {}; // ファイルの中での重なり：type|鍵 → [{ index, rec }]

    return ((data && data.records) || []).map(function (raw, index) {
      raw = raw && typeof raw === 'object' ? raw : {};
      var type = String(raw.type || '').trim();
      var item = {
        index: index, type: type, label: '', rec: {}, from: baseName(raw.from), memo: String(raw.memo == null ? '' : raw.memo).trim(),
        unclear: [], dropped: [], defaulted: [], problems: [], duplicateOf: null,
        certificateId: '', canImport: true, checked: true
      };
      function problem(level, code, message, key) { item.problems.push({ level: level, code: code, key: key || '', message: message }); }

      var def = type === 'process' ? { label: '手続きを始める', fields: PROCESS_FIELDS } : (schema.collections || {})[type];
      if (IMPORT_TYPES.indexOf(type) < 0 || !def) {
        item.label = type || '（種類なし）';
        problem('block', 'badType', type ? 'この種類（' + type + '）は取り込めません' : '記録の種類（type）がありません');
        return finish(item);
      }
      item.label = def.label;
      var src = raw.data && typeof raw.data === 'object' && !Array.isArray(raw.data) ? raw.data : null;
      if (!src) { problem('block', 'noData', '項目と値（data）がありません'); return finish(item); }

      var fields = {};
      def.fields.forEach(function (f) { fields[f.key] = f; });
      var rec = item.rec;

      // 1. 項目を選ぶ：定義にない・番号・自動で入る項目は捨てる
      Object.keys(src).forEach(function (k) {
        var f = fields[k], v = src[k];
        if (IMPORT_NUMBER_KEYS.indexOf(k) >= 0 && type !== 'process') { item.dropped.push({ key: k, reason: 'number' }); return; }
        if (!f) { item.dropped.push({ key: k, reason: 'unknown' }); return; }
        if (f.hidden || f.type === 'ref' || f.type === 'refs' || k === 'sourceFile') { item.dropped.push({ key: k, reason: 'auto' }); return; }
        if (v == null || v === '') return;
        if (typeof v === 'object') { item.dropped.push({ key: k, reason: 'badValue' }); return; }
        rec[k] = typeof v === 'string' ? v.trim() : (f.type === 'number' ? v : String(v));
      });
      if (item.dropped.some(function (d) { return d.reason === 'number'; })) {
        problem('info', 'numberDropped', '番号の項目は取り込みません。必要なら、取り込んだあとに手で入れてください');
      }

      // 2. 値を調べる
      def.fields.forEach(function (f) {
        var k = f.key;
        if (!(k in rec)) return;
        var v = rec[k];
        if (f.type === 'date' || f.type === 'month') {
          var s = String(v);
          if (s.normalize) s = s.normalize('NFKC').trim();
          rec[k] = s;
          if (WAREKI_RE.test(s)) { problem('block', 'wareki', f.label + 'が和暦のままです（' + s + '）。西暦に直してください', k); return; }
          var ok = f.type === 'date' ? isRealDate(s) : isRealMonth(s);
          if (!ok) { problem('block', 'badDate', f.label + 'の形が正しくありません（' + s + '）。' + (f.type === 'date' ? 'YYYY-MM-DD' : 'YYYY-MM') + ' の形で書きます', k); return; }
          if (f.pastOnly) {
            var cut = f.type === 'date' ? today : today.slice(0, 7);
            if (s > cut) problem('warn', 'future', f.label + 'が未来の日付です（' + s + '）', k);
            else if (birth && s < (f.type === 'date' ? birth : birth.slice(0, 7))) {
              problem('warn', 'beforeBirth', f.label + '：生まれる前の日付です。妊娠中の記録ならこのままで大丈夫です', k);
            }
          }
          return;
        }
        if (f.type === 'select') {
          var vals = optionValues(f, schema);
          if (vals && vals.indexOf(v) < 0) problem('warn', 'notInOptions', f.label + '「' + v + '」は選択肢にありません', k);
          return;
        }
        if (f.type === 'number' && (v === '' || isNaN(Number(v)))) { problem('warn', 'notInOptions', f.label + 'が数ではありません（' + v + '）', k); return; }
        if (f.type === 'template' && !findTemplate(templates, v)) {
          problem(type === 'process' ? 'block' : 'warn', 'noTemplate', '手続きの型「' + v + '」がありません', k);
        }
      });

      // 3. 手続き：締め切りがなく、型に「生年月日から決める」があれば、それを入れる
      var tpl = type === 'process' ? findTemplate(templates, rec.templateId) : null;
      if (tpl && !rec.deadline && birth) {
        var bd = birthDeadline(tpl, birth);
        if (bd && bd.date) {
          rec.deadline = bd.date;
          item.defaulted.push('deadline');
          problem('info', 'deadlineFromBirth', '締め切りがないので、生年月日から「' + bd.label + '」（' + bd.date + '）を入れました', 'deadline');
        }
      }

      // 4. 必須の項目（値がないもの）
      def.fields.forEach(function (f) {
        if (f.required && !(f.key in rec) && !item.problems.some(function (p) { return p.key === f.key && p.level === 'block'; })) {
          // 手続きは、型と締め切りがないと工程を作れないので取り込めない
          problem(type === 'process' ? 'block' : 'warn', 'required', f.label + 'がありません', f.key);
        }
      });

      // 5. 入っていない項目に、ふだんの入力と同じ初めの値を入れる（必須の項目には入れない＝推測で埋めない）
      def.fields.forEach(function (f) {
        if (f.default === undefined || f.required || f.hidden || f.key in rec) return;
        rec[f.key] = (type === 'profile' && f.key === 'visibility' && (schema.options.categoryVisibility || {})[rec.category]) || f.default;
        item.defaulted.push(f.key);
      });

      // 6. AIが自信のない項目（取り込む項目にあるものだけ）
      (Array.isArray(raw.unclear) ? raw.unclear : []).forEach(function (k) {
        k = String(k);
        if (k in rec && item.unclear.indexOf(k) < 0 && item.defaulted.indexOf(k) < 0) item.unclear.push(k);
      });
      if (item.unclear.length) {
        problem('warn', 'unclear', 'AIが自信がない項目：' + item.unclear.map(function (k) { return fields[k].label; }).join('、'));
      }

      if (type !== 'process') rec.sourceFile = item.from;

      // 7. 重なり（今のデータ → ファイルの中の前の記録）
      if (type === 'process') {
        if (tpl) {
          var running = alive(db.tasks).filter(function (t) {
            return t.templateId === tpl.id && t.childId === childId && t.status === 'todo';
          });
          if (running.length) item.duplicateOf = { col: 'tasks', id: running[0].processId, index: -1, text: duplicateText('process', running[0]) };
          // 型の受給者証の種類に合うものが1つだけなら、最初から選んでおく
          var certs = alive(db.certificates).filter(function (c) {
            return c.childId === childId && (tpl.certificateKinds || []).indexOf(c.kind) >= 0;
          });
          if (certs.length === 1) item.certificateId = certs[0].id;
        }
        var pkey = rec.templateId ? 'process|' + rec.templateId : '';
        if (!item.duplicateOf && pkey && seen[pkey]) item.duplicateOf = { col: '', id: '', index: seen[pkey][0].index, text: duplicateText('process', seen[pkey][0].rec) };
        if (pkey) (seen[pkey] = seen[pkey] || []).push({ index: index, rec: rec });
        if (item.duplicateOf) problem('warn', 'duplicate', item.duplicateOf.index >= 0
          ? 'このファイルの中に、同じ手続きがもう1つあります'
          : 'この手続きは、もう始まっています（' + item.duplicateOf.text + '）');
        return finish(item);
      }
      var key = duplicateKey(type, rec);
      if (key) {
        var hit = alive(db[type]).filter(function (r) {
          return r.childId === childId && duplicateKey(type, r) === key && sameDuplicate(type, r, rec);
        })[0];
        if (hit) item.duplicateOf = { col: type, id: hit.id, index: -1, text: duplicateText(type, hit) };
        else {
          var prev = (seen[type + '|' + key] || []).filter(function (x) { return sameDuplicate(type, x.rec, rec); })[0];
          if (prev) item.duplicateOf = { col: '', id: '', index: prev.index, text: duplicateText(type, prev.rec) };
        }
        (seen[type + '|' + key] = seen[type + '|' + key] || []).push({ index: index, rec: rec });
      }
      if (item.duplicateOf) {
        problem('warn', 'duplicate', item.duplicateOf.index >= 0
          ? 'このファイルの中に、同じものがもう1つあります（' + item.duplicateOf.text + '）'
          : 'すでに同じものがありそうです（' + item.duplicateOf.text + '）');
      }
      return finish(item);
    });

    function finish(item) {
      item.canImport = !item.problems.some(function (p) { return p.level === 'block'; });
      item.checked = item.canImport && !item.problems.some(function (p) { return p.level === 'warn'; });
      return item;
    }
  }

  /**
   * 確認の画面でチェックした記録を、保存できる形 [{ col, rec }] にする。
   *   items     … checkImport() の結果（checked が true で、canImport も true のものだけ使う）
   *   childId   … 取り込む先の子ども
   *   templates … src/templates.json
   *   today     … 'YYYY-MM-DD'（手続きの工程の目安日を、今日より前にしないため）
   *   opts      … { db: 今のデータ }（工程の連絡先・子どもの情報の並び順に使う）
   * process は planProcess() で工程ごとのタスクにする。手続きの受給者証は item.certificateId（画面で選ぶ）。
   */
  function applyImport(items, childId, templates, today, opts) {
    opts = opts || {};
    var db = opts.db || {};
    var now = nowIso();
    var out = [];
    var mine = function (col) { return alive(db[col]).filter(function (r) { return r.childId === childId; }); };
    var picked = (items || []).filter(function (it) { return it && it.checked && it.canImport; });
    var order = mine('profile').reduce(function (m, p) { return Math.max(m, Number(p.order) || 0); }, 0);
    // 先に記録を作る（同じファイルの医療機関を、手続きの連絡先に使えるように）
    picked.forEach(function (it) {
      if (it.type === 'process') return;
      var rec = { id: uuid(), createdAt: now, updatedAt: now, deleted: false, childId: childId };
      Object.keys(it.rec).forEach(function (k) { rec[k] = it.rec[k]; });
      if (it.type === 'profile') rec.order = ++order;
      out.push({ col: it.type, rec: rec });
    });
    var byKind = {};
    mine('contacts').concat(out.filter(function (x) { return x.col === 'contacts'; }).map(function (x) { return x.rec; }))
      .forEach(function (c) { if (c.kind && !byKind[c.kind]) byKind[c.kind] = c.id; });
    picked.forEach(function (it) {
      if (it.type !== 'process') return;
      var tpl = findTemplate(templates, it.rec.templateId);
      if (!tpl || !it.rec.deadline) return;
      planProcess(tpl, it.rec.deadline, {
        childId: childId, today: today || ymd(), contactIdsByKind: byKind,
        certificateId: it.certificateId || '', processName: it.rec.name || tpl.name
      }).forEach(function (t) { out.push({ col: 'tasks', rec: t }); });
    });
    return out;
  }

<script>
/*
 * たすかReマインド Googleドライブ同期（かんたん版＝GitHub Pages版だけで使う）
 *
 * しくみ
 *   - データの本体はこれまでどおり「この端末」（localStorage）。ネットがなくても使える
 *   - 同期をオンにすると、利用者自身のGoogleドライブの「アプリ専用フォルダ（appDataFolder）」に
 *     書き出しファイルと同じ形のJSONを1つ置き、端末どうしで「取得 → 結合 → 保存」する
 *   - 結合の決まりは読み込みと同じ：同じIDなら更新日時が新しい方を残す。削除は「削除済み」の印で伝わる
 *   - 権限は drive.appdata（このアプリが作ったファイルだけ）と email（どのアカウントか表示するため）だけ。
 *     ドライブのほかのファイルは見えない
 *   - ログインの合言葉（アクセストークン）はこのブラウザのタブの中だけに置き、外には送らない
 */
var DriveSync = (function () {
  'use strict';

  var GIS_SRC = 'https://accounts.google.com/gsi/client';
  var API = 'https://www.googleapis.com/drive/v3/files';
  var UPLOAD = 'https://www.googleapis.com/upload/drive/v3/files';
  var DRIVE_SCOPE = 'https://www.googleapis.com/auth/drive.appdata';
  var SCOPE = DRIVE_SCOPE + ' email';
  // ログイン画面で「アプリ専用のデータ」のチェックが外されたとき
  var MSG_SCOPE = 'Googleドライブへの保存が許可されていません。もう一度ログインし、' +
    'ログインの画面で「Googleドライブのアプリ専用データ」の項目にチェックを入れてから「続行」を押してください';
  var META_KEY = 'task-a-remind/v1/sync';
  var TOKEN_KEY = 'task-a-remind/v1/sync-token';

  function readJson(storage, key) {
    try { return JSON.parse(storage.getItem(key)) || null; } catch (e) { return null; }
  }
  function writeJson(storage, key, v) {
    try { if (v == null) storage.removeItem(key); else storage.setItem(key, JSON.stringify(v)); } catch (e) { /* 保存できなくても動く */ }
  }

  var gisPromise = null;
  function loadGis() {
    if (typeof google !== 'undefined' && google.accounts && google.accounts.oauth2) return Promise.resolve();
    if (gisPromise) return gisPromise;
    gisPromise = new Promise(function (resolve, reject) {
      var s = document.createElement('script');
      s.src = GIS_SRC;
      s.async = true;
      s.onload = function () { resolve(); };
      s.onerror = function () { gisPromise = null; reject(new Error('Googleのログイン画面を読み込めませんでした。ネットにつながっているか確認してください')); };
      document.head.appendChild(s);
    });
    return gisPromise;
  }

  /**
   * opts: {
   *   clientId, fileName, collections: [名前...],
   *   getDb(): 今のデータ { col: [records] },
   *   applyRemote(changed: [{col, rec}]): Promise  … ドライブ側の新しい記録を端末に保存する
   *   onChange(): 状態が変わったら呼ぶ（画面の描き直し）
   *   meta: { app情報 }
   * }
   */
  function create(opts) {
    var meta = readJson(localStorage, META_KEY) || { enabled: false, fileId: '', lastSyncAt: '', email: '' };
    var tok = readJson(sessionStorage, TOKEN_KEY); // { access_token, exp }
    var st = { state: meta.enabled ? 'idle' : 'off', error: '', syncing: false, again: false };
    var tokenClient = null;
    var timer = null;

    function saveMeta() { writeJson(localStorage, META_KEY, meta); }
    function set(state, error) { st.state = state; st.error = error || ''; if (opts.onChange) opts.onChange(); }
    function tokenValid() { return !!(tok && tok.access_token && tok.exp > Date.now() + 60000); }

    function requestToken(prompt) {
      return loadGis().then(function () {
        return new Promise(function (resolve, reject) {
          if (!tokenClient) {
            tokenClient = google.accounts.oauth2.initTokenClient({
              client_id: opts.clientId, scope: SCOPE, callback: function () {}
            });
          }
          tokenClient.callback = function (res) {
            if (!res || res.error || !res.access_token) { reject(new Error(res && res.error === 'access_denied' ? 'Googleへのログインが許可されませんでした' : 'Googleにログインできませんでした')); return; }
            // ログイン画面では、許可する項目のチェックを外せる。ドライブのチェックが外されていたら、同期はできない
            if (res.scope && String(res.scope).split(' ').indexOf(DRIVE_SCOPE) < 0) {
              meta.needConsent = true; saveMeta();
              var se = new Error(MSG_SCOPE); se.needScope = true; reject(se); return;
            }
            if (meta.needConsent) { meta.needConsent = false; saveMeta(); }
            tok = { access_token: res.access_token, exp: Date.now() + (Number(res.expires_in) || 3600) * 1000 };
            writeJson(sessionStorage, TOKEN_KEY, tok);
            resolve();
          };
          tokenClient.error_callback = function (err) {
            reject(new Error(err && err.type === 'popup_closed' ? 'ログインの画面が閉じられました' : 'Googleのログイン画面を開けませんでした（ポップアップがブロックされていないか確認してください）'));
          };
          tokenClient.requestAccessToken({ prompt: prompt, login_hint: meta.email || undefined });
        });
      });
    }

    function api(url, init) {
      init = init || {};
      init.headers = Object.assign({ Authorization: 'Bearer ' + tok.access_token }, init.headers || {});
      return fetch(url, init).catch(function () {
        throw new Error('ネットにつながっていないため同期できませんでした。データはこの端末に保存されています。電波が戻ると自動で同期します');
      }).then(function (res) {
        if (res.status === 401) { tok = null; writeJson(sessionStorage, TOKEN_KEY, null); var e = new Error('login'); e.needLogin = true; throw e; }
        if (!res.ok) return res.text().catch(function () { return ''; }).then(function (body) { throw apiError(res.status, body); });
        return res;
      });
    }

    /** Googleから返ってきたエラーの理由を、わかりやすい言葉にする */
    function apiError(status, body) {
      var reason = '', detail = '';
      try {
        var j = JSON.parse(body).error || {};
        detail = j.message || '';
        reason = (j.errors && j.errors[0] && j.errors[0].reason) || '';
        (j.details || []).forEach(function (d) { if (!reason && d && d.reason) reason = d.reason; });
        if (!reason) reason = j.status || '';
      } catch (x) { /* 本文がJSONでないときは理由なし */ }
      var e;
      if (/insufficientPermissions|SCOPE_INSUFFICIENT|insufficient authentication scopes/i.test(reason + ' ' + detail)) {
        tok = null; writeJson(sessionStorage, TOKEN_KEY, null);
        meta.needConsent = true; saveMeta();
        e = new Error(MSG_SCOPE); e.needScope = true; e.needLogin = true;
      } else if (/accessNotConfigured|SERVICE_DISABLED|has not been used|is disabled/i.test(reason + ' ' + detail)) {
        e = new Error('Googleドライブを使う設定が、まだ有効になっていません。アプリを管理する人に「Google Cloud で Google Drive API を有効にしてください」と伝えてください（' + status + '）');
      } else if (/rateLimitExceeded|userRateLimitExceeded|RATE_LIMIT|quotaExceeded/i.test(reason) && !/storageQuota/i.test(reason)) {
        e = new Error('Googleドライブが混み合っています。数分待ってから、もう一度お試しください（' + status + '）');
      } else if (/storageQuotaExceeded/i.test(reason)) {
        e = new Error('Googleドライブの保存容量がいっぱいです。ドライブの不要なファイルを消してから、もう一度お試しください');
      } else {
        e = new Error('Googleドライブとの通信に失敗しました（' + status + (reason ? '・' + reason : '') + '）。しばらくしてからもう一度お試しください');
      }
      e.status = status; e.reason = reason; e.detail = detail;
      if (typeof console !== 'undefined') console.warn('[task-a-remind] Googleドライブ', status, reason, detail);
      return e;
    }

    function findFile() {
      var q = encodeURIComponent("name='" + opts.fileName + "' and trashed=false");
      return api(API + '?spaces=appDataFolder&fields=files(id,modifiedTime)&q=' + q).then(function (r) { return r.json(); })
        .then(function (j) { return j.files && j.files[0] ? j.files[0].id : ''; });
    }
    function download(id) {
      return api(API + '/' + encodeURIComponent(id) + '?alt=media').then(function (r) { return r.text(); })
        .then(function (t) { return t ? JSON.parse(t) : null; });
    }
    function createFile(content) {
      var boundary = 'taskaremind' + Date.now();
      var body = '--' + boundary + '\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n' +
        JSON.stringify({ name: opts.fileName, parents: ['appDataFolder'], mimeType: 'application/json' }) +
        '\r\n--' + boundary + '\r\nContent-Type: application/json\r\n\r\n' + content + '\r\n--' + boundary + '--';
      return api(UPLOAD + '?uploadType=multipart&fields=id', { method: 'POST', headers: { 'Content-Type': 'multipart/related; boundary=' + boundary }, body: body })
        .then(function (r) { return r.json(); }).then(function (j) { return j.id; });
    }
    function updateFile(id, content) {
      return api(UPLOAD + '/' + encodeURIComponent(id) + '?uploadType=media&fields=id', { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: content });
    }

      return api('https://www.googleapis.com/oauth2/v3/userinfo').then(function (r) { return r.json(); })
        .then(function (j) { meta.email = j.email || meta.email; saveMeta(); }).catch(function () { /* 表示できなくても同期はできる */ });
    }

    /** 取得 → 結合 → 保存 */
    function syncNow() {
      if (!meta.enabled) return Promise.resolve(false);
      if (!tokenValid()) { set('needLogin'); return Promise.resolve(false); }
      if (st.syncing) { st.again = true; return Promise.resolve(false); }
      st.syncing = true;
      set('syncing');
      var remoteCols = null;
      return (meta.fileId ? Promise.resolve(meta.fileId) : findFile()).then(function (id) {
        meta.fileId = id;
        return id ? download(id).catch(function (e) {
          if (e.needLogin || e.status !== 404) throw e; // 通信の失敗で、ファイルを作り直さない
          meta.fileId = ''; return null; // ファイルが消されていたら作り直す
        }) : null;
      }).then(function (remote) {
        var applied = Promise.resolve();
        remoteCols = {};
        opts.collections.forEach(function (c) { remoteCols[c] = []; });
        if (remote) {
          var data = Logic.migrate(remote);
          Object.keys(data.collections).forEach(function (c) { if (remoteCols[c]) remoteCols[c] = data.collections[c] || []; });
          var incoming = Logic.mergeImport(opts.getDb(), remoteCols);
          if (incoming.length) applied = opts.applyRemote(incoming);
        }
        return applied;
      }).then(function () {
        // 端末の方が新しい記録（またはドライブにない記録）があれば、ドライブを更新する
        var outgoing = Logic.mergeImport(remoteCols, opts.getDb());
        if (meta.fileId && !outgoing.length) return;
        var content = JSON.stringify(Logic.makeExport(opts.getDb(), opts.meta || {}));
        return meta.fileId ? updateFile(meta.fileId, content) : createFile(content).then(function (id) { meta.fileId = id; });
      }).then(function () {

        saveMeta();
        st.syncing = false;
        set('idle');
        if (st.again) { st.again = false; return syncNow(); }
        return true;
      }).catch(function (e) {
        st.syncing = false;
        st.again = false;
        saveMeta();
        if (e && e.needLogin) set('needLogin', e.needScope ? e.message : ''); else set('error', (e && e.message) || String(e));
