# v0.2.0 のようなタグを push すると、配布用の zip を作って GitHub の「Releases」に置く
name: リリース

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: テスト
        run: npm test

      - name: バージョンの確認（タグと package.json が同じか）
        run: |
          v=$(node -p "require('./package.json').version")
          if [ "v$v" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::タグ ${GITHUB_REF_NAME} と package.json の version ($v) が違います"
            exit 1
          fi

      - name: 配布用の zip を作る
        run: |
          mkdir -p dist
          (cd gas && zip -q ../dist/tasuka-remind-gas-${GITHUB_REF_NAME}.zip Code.gs Shared.gs Index.html appsscript.json)
          (cd docs && zip -qr ../dist/tasuka-remind-web-${GITHUB_REF_NAME}.zip .)

      - name: Releases に置く
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/*.zip \
            --title "たすかReマインド ${GITHUB_REF_NAME}" \
            --notes "変更点は CHANGELOG.md を見てください。GAS版は tasuka-remind-gas-*.zip の4ファイルを Apps Script に貼り付けます。"
