# main に push されると、Web版（かんたん版）を GitHub Pages に公開する
# 事前に Settings → Pages → Source を「GitHub Actions」にしておく
name: Web版を公開

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'docs/**'
      - 'build.mjs'
      - 'package.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: テスト（失敗したら公開しない）
        run: npm test

      - name: 公開するファイルを用意
        run: |
          mkdir -p _site
          cp -r docs/. _site/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
